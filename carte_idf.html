<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Île-de-France — réseau traversant (simulation)</title>
<link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css"
      onerror="this.onerror=null;this.href='https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.min.css'">
<style>
:root{
  --bg:#0b0c0f; --panel:rgba(28,29,33,.72); --panel-solid:#1c1d21; --line:rgba(255,255,255,.08);
  --text:#f5f5f7; --muted:#9a9aa1; --chip:rgba(255,255,255,.06); --chip-on:rgba(255,255,255,.14);
  --accent:#0a84ff; --halo:#0b0c0f; --shadow:0 10px 40px rgba(0,0,0,.45);
}
body.light{
  --bg:#f2f2f7; --panel:rgba(255,255,255,.75); --panel-solid:#fff; --line:rgba(0,0,0,.08);
  --text:#1d1d1f; --muted:#6e6e73; --chip:rgba(0,0,0,.04); --chip-on:rgba(0,0,0,.09);
  --accent:#007aff; --halo:#ffffff; --shadow:0 10px 40px rgba(0,0,0,.15);
}
*{box-sizing:border-box}
html,body{margin:0;height:100%;background:var(--bg);color:var(--text);
  font:14px/1.35 -apple-system,BlinkMacSystemFont,"SF Pro Text","Inter","Segoe UI",Roboto,sans-serif;-webkit-font-smoothing:antialiased}
#map{position:fixed;inset:0;background:var(--bg)}
.leaflet-container{background:var(--bg);font:inherit}
.dark-filter{filter:invert(1) hue-rotate(180deg) brightness(.85) contrast(.9) saturate(.5)}

/* Panneau */
#panel{position:fixed;top:max(14px,env(safe-area-inset-top));left:14px;bottom:14px;width:340px;z-index:1000;
  display:flex;flex-direction:column;background:var(--panel);backdrop-filter:blur(24px) saturate(1.6);
  -webkit-backdrop-filter:blur(24px) saturate(1.6);border:1px solid var(--line);border-radius:20px;box-shadow:var(--shadow);overflow:hidden}
#panel header{padding:16px 16px 10px}
#panel h1{margin:0;font-size:19px;font-weight:700;letter-spacing:-.02em}
#panel .sub{color:var(--muted);font-size:12.5px;margin-top:2px}
.toolbar{display:flex;gap:6px;margin-top:12px}
.seg{display:flex;background:var(--chip);border-radius:10px;padding:2px;flex:1}
.seg button{flex:1;border:0;background:transparent;color:var(--text);font:inherit;font-size:12.5px;padding:6px 4px;border-radius:8px;cursor:pointer}
.seg button.on{background:var(--chip-on);font-weight:600}
select,input[type=search]{width:100%;border:0;border-radius:10px;background:var(--chip);color:var(--text);font:inherit;padding:8px 10px;outline:none}
select option{background:var(--panel-solid);color:var(--text)}
.row{display:flex;gap:6px;margin-top:8px}
#list{overflow:auto;padding:4px 10px 14px;flex:1;-webkit-overflow-scrolling:touch}
.group{margin-top:12px}
.ghead{display:flex;align-items:center;justify-content:space-between;padding:4px 6px}
.ghead .t{font-size:12px;text-transform:uppercase;letter-spacing:.06em;color:var(--muted);font-weight:600}
.ghead .acts button{border:0;background:none;color:var(--accent);font:inherit;font-size:12.5px;cursor:pointer;padding:2px 4px}
.chips{display:grid;grid-template-columns:minmax(0,1fr);gap:4px}
.chip{display:flex;align-items:center;gap:10px;padding:7px 8px;border-radius:12px;cursor:pointer;user-select:none;transition:background .15s, opacity .15s}
.chip:hover{background:var(--chip)}
.chip.on{background:var(--chip-on)}
.chip:not(.on){opacity:.55}
.badge{min-width:28px;height:28px;border-radius:8px;display:flex;align-items:center;justify-content:center;font-weight:800;font-size:14px;color:#fff;padding:0 6px;flex-shrink:0}
.badge.circle{border-radius:50%;width:28px;padding:0}
.badge.tram{border-radius:6px;font-size:12px}
.chip .txt{flex:1;min-width:0}
.chip .nm{font-weight:600;font-size:13.5px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.chip .ds{color:var(--muted);font-size:11.5px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.chip .tag{font-size:10px;font-weight:700;padding:2px 6px;border-radius:6px;background:rgba(255,159,10,.2);color:#ff9f0a;margin-left:6px;vertical-align:1px}
.chip .tag.approx{background:rgba(142,142,147,.22);color:var(--muted)}
.chip .zoom{border:0;background:none;color:var(--muted);cursor:pointer;font-size:15px;padding:4px;border-radius:6px}
.chip .zoom:hover{color:var(--text)}
.chip.nodata .ds::after{content:" · en attente des données"}
#status{padding:9px 16px;border-top:1px solid var(--line);font-size:12px;color:var(--muted);display:flex;flex-wrap:wrap;gap:6px 8px;align-items:center}
#stxt{flex:1 1 calc(100% - 20px)}
#status .dot{width:8px;height:8px;border-radius:50%;background:#ff9f0a;flex-shrink:0}
#status.ok .dot{background:#30d158}
#status.err .dot{background:#ff453a}
#status button{border:0;background:var(--chip);color:var(--text);font:inherit;font-size:11.5px;border-radius:8px;padding:4px 8px;cursor:pointer}
#handle{display:none}
#save{margin-left:auto}
#status button.pulse{background:var(--accent);color:#fff}

/* Légende */
#legend{position:fixed;right:14px;bottom:24px;z-index:900;background:var(--panel);backdrop-filter:blur(20px);-webkit-backdrop-filter:blur(20px);
  border:1px solid var(--line);border-radius:14px;padding:10px 12px;font-size:12px;color:var(--muted);box-shadow:var(--shadow)}
#legend div{display:flex;align-items:center;gap:8px;margin:2px 0}
#legend i{display:inline-block;width:26px;height:0;border-top:4px solid var(--text)}
#legend i.dash{border-top:4px dotted #ff9f0a}
#legend i.thin{border-top-width:2px}

/* Leaflet habillage */
.leaflet-popup-content-wrapper,.leaflet-tooltip{background:var(--panel-solid);color:var(--text);border-radius:12px;box-shadow:var(--shadow);border:1px solid var(--line)}
.leaflet-popup-tip{background:var(--panel-solid)}
.leaflet-tooltip{border-radius:8px;padding:4px 8px;font-size:12px}
.leaflet-tooltip:before{display:none}
.leaflet-control-zoom a{background:var(--panel-solid)!important;color:var(--text)!important;border-color:var(--line)!important}
.leaflet-control-attribution{background:var(--panel)!important;color:var(--muted)!important;border-radius:8px 0 0 0;font-size:10px}
.leaflet-control-attribution a{color:var(--muted)!important}
.pop h3{margin:0 0 4px;font-size:15px}
.pop p{margin:2px 0;color:var(--muted);font-size:12.5px}

@media (max-width:720px){
  #panel{top:auto;left:0;right:0;bottom:0;width:auto;height:52vh;border-radius:20px 20px 0 0;transition:height .25s ease;
    padding-bottom:env(safe-area-inset-bottom)}
  #panel.collapsed{height:118px}
  #handle{display:block;flex-shrink:0;width:38px;height:5px;box-sizing:content-box;padding:8px 30px;border-radius:3px;background:var(--muted);background-clip:content-box;opacity:.5;margin:0 auto;cursor:pointer}
  #panel header{padding-top:6px}
  #legend{top:max(10px,env(safe-area-inset-top));bottom:auto;left:10px;right:auto;font-size:10.5px;padding:7px 9px}
  #legend i{width:18px}
  .leaflet-top.leaflet-right{top:max(0px,env(safe-area-inset-top))}
}
</style>
</head>
<body>
<div id="map"></div>

<aside id="panel">
  <div id="handle" title="Afficher / masquer"></div>
  <header>
    <h1>Réseau francilien traversant</h1>
    <div class="sub">Simulation · tracés réels OpenStreetMap · A1, E1, G, H, J1, L1 retravaillées</div>
    <div class="toolbar">
      <div class="seg" id="theme"><button data-v="dark" class="on">Sombre</button><button data-v="light">Clair</button></div>
    </div>
    <div class="row">
      <select id="basemap" aria-label="Fond de carte">
        <option value="auto">Fond : automatique (suit le thème)</option>
        <option value="esri-dark">Gris foncé épuré</option>
        <option value="esri-light">Gris clair épuré</option>
        <option value="esri-street-dark">Plan détaillé (sombre)</option>
        <option value="esri-street">Plan détaillé (couleur)</option>
        <option value="esri-sat">Satellite</option>
        <option value="osm">OpenStreetMap (serveur http requis)</option>
      </select>
    </div>
    <div class="row"><input type="search" id="q" placeholder="Filtrer les lignes (ex. 15, T3, RER)…"></div>
  </header>
  <div id="list"></div>
  <div id="status"><span class="dot"></span><span id="stxt">Préparation…</span><button id="save" title="Enregistrer les données dans donnees_idf.js (à mettre à côté de la carte)">Enregistrer</button><button id="open" title="Charger un fichier donnees_idf.js">Charger</button><button id="reload" title="Retélécharger depuis OpenStreetMap">↻</button><input type="file" id="file" accept=".js,.json" hidden></div>
</aside>

<div id="legend">
  <div><i></i>Ligne exploitée (tracé OSM)</div>
  <div><i class="dash"></i>Tunnel à creuser (scénario)</div>
  <div><i class="thin" style="border-top-style:dashed"></i>Tracé approx. (pas dans OSM)</div>
</div>

<!-- Données locales : si donnees_idf.js est dans le même dossier, aucun téléchargement -->
<script src="donnees_idf.js"></script>
<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
<script>
if(!window.L){document.write('<script src="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.min.js"><\/script>')}

function catmull(pts,n){ // pts [[lat,lng],..] -> courbe lissée
  if(pts.length<3)return pts;
  const out=[],q=[pts[0],...pts,pts[pts.length-1]];
  for(let i=1;i<q.length-2;i++){
    const [p0,p1,p2,p3]=[q[i-1],q[i],q[i+1],q[i+2]];
    for(let s=0;s<n;s++){const t=s/n,t2=t*t,t3=t2*t;
      out.push([0,1].map(k=>.5*((2*p1[k])+(-p0[k]+p2[k])*t+(2*p0[k]-5*p1[k]+4*p2[k]-p3[k])*t2+(-p0[k]+3*p1[k]-3*p2[k]+p3[k])*t3)));}
  }
  out.push(pts[pts.length-1]);return out;
}

const W={rer:5,tl:4,tlnew:4,gpe:5,metro:3.2,tram:3,act:3.5};

function haloColor(){return getComputedStyle(document.body).getPropertyValue('--halo').trim()||'#000'}
function popupHtml(l,extra){return `<div class="pop"><h3>${l.name}</h3><p>${l.desc||''}</p>${extra?`<p>${extra}</p>`:''}</div>`}

// Décale une polyligne projetée de d pixels, perpendiculairement (joints en onglet bornés)
function offsetRing(pts,d){
  const n=pts.length;if(n<2||!d)return pts;
  const nx=[],ny=[];
  for(let i=0;i<n-1;i++){const dx=pts[i+1].x-pts[i].x,dy=pts[i+1].y-pts[i].y,len=Math.hypot(dx,dy);
    if(len<1e-6){nx.push(null);ny.push(null)}else{nx.push(-dy/len);ny.push(dx/len)}}
  let k=null;for(let i=0;i<nx.length;i++){if(nx[i]===null){if(k!==null){nx[i]=nx[k];ny[i]=ny[k]}}else k=i}
  k=null;for(let i=nx.length-1;i>=0;i--){if(nx[i]===null){if(k!==null){nx[i]=nx[k];ny[i]=ny[k]}}else k=i}
  if(nx[0]===null)return pts;
  const out=new Array(n);
  for(let i=0;i<n;i++){
    let ax,ay;
    if(i===0){ax=nx[0];ay=ny[0]}else if(i===n-1){ax=nx[n-2];ay=ny[n-2]}
    else{ax=nx[i-1]+nx[i];ay=ny[i-1]+ny[i];const m=Math.hypot(ax,ay);
      if(m<1e-6){ax=nx[i];ay=ny[i]}else{ax/=m;ay/=m;const c=ax*nx[i]+ay*ny[i],f=1/Math.max(c,.5);ax*=f;ay*=f}}
    out[i]=L.point(pts[i].x+ax*d,pts[i].y+ay*d);
  }
  return out;
}
const OffsetLine=L.Polyline.extend({
  _projectLatlngs(latlngs,result,projectedBounds){
    const flat=latlngs[0] instanceof L.LatLng;
    L.Polyline.prototype._projectLatlngs.call(this,latlngs,result,projectedBounds);
    if(flat&&this.options.offset&&result.length)result[result.length-1]=offsetRing(result[result.length-1],this.options.offset);
  }
});

function nearestVertex(ids,lat,lon){
  let best=null,bd=Infinity;
  for(const id of ids){const g=wayLL(id);if(!g)continue;
    for(const p of g){const d=(p[0]-lat)**2+((p[1]-lon)*.66)**2;if(d<bd){bd=d;best=p}}}
  return best;
}
function lengthKm(lines){let t=0;for(const ln of lines)for(let i=1;i<ln.length;i++)t+=map.distance(ln[i-1],ln[i]);return t/1000}
function stationLayer(l,list){
  const g=L.layerGroup();
  for(const st of list)L.circleMarker([st[1],st[2]],{radius:3.2,color:l.color,weight:2,fillColor:'#f5f5f7',fillOpacity:1,renderer:canvas})
    .bindTooltip(st[0],{direction:'top',offset:[0,-4]}).addTo(g);
  return g;
}
// Prépare (une fois par jeu de données) : voies OSM retenues, tracés approchés, gares, emprise
function prepare(l){
  const s=state[l.id];
  const c=DATA?collect(l):{ways:[],stations:[]};
  const info={ways:c.ways,stations:c.stations,approx:[]};
  if(l.fb){ // GPE : OSM si complet, sinon gares reliées
    const fbl=FB[l.fb].map(br=>catmull(br.map(x=>[x[1],x[2]]),br.length>30?4:10));
    if(!info.ways.length||lengthKm(info.ways.map(wayLL))<0.6*lengthKm(fbl)){
      const seen=new Set(),st=[];for(const br of FB[l.fb])for(const x of br)if(x[0]&&!seen.has(x[0])){seen.add(x[0]);st.push(x)}
      info.ways=[];info.stations=st;info.approx.push({lines:fbl,label:'Tracé approximatif (gares reliées) — absent des données OSM.'});
    }
  }
  if(l.ext){ // RER E : Nanterre → Houilles → Poissy → Mantes
    const reach=(ids,x)=>ids.some(id=>{const g=wayLL(id);return g&&g.some(p=>p[1]<x)});
    const eOwn=DATA?collect({src:['RER:E']}).ways:[];
    const pts=l.ext.pts;
    if(!reach(info.ways,1.80)){                                         // rien à l'ouest : tout en approché
      info.approx.push({lines:[catmull(pts.map(p=>[p[1],p[2]]),8)],label:l.ext.label+'<br>Tracé approximatif (gares reliées).'});
      const have=new Set(info.stations.map(x=>x[0]));for(const p of pts)if(p[0]&&!have.has(p[0]))info.stations.push(p);
    }else if(eOwn.length&&!reach(eOwn,2.212)){
      // Raccord EOLE : bout réel du RER E dans OSM (près de La Folie) → voie réelle la plus proche de Nanterre-Université
      const others=info.ways.filter(id=>!eOwn.includes(id));
      const a=nearestVertex(eOwn,48.8953,2.2150),b=nearestVertex(others,48.9013,2.2142);
      if(a&&b&&map.distance(a,b)<3000){
        const mid=[(a[0]+b[0])/2+.0006,(a[1]+b[1])/2-.0006];
        info.approx.push({lines:[catmull([a,mid,b],10)],label:'Raccord Nanterre-La Folie → Nanterre-Université (tracé approximatif)'});
      }
    }
  }
  for(const lk of (l.links||[])){ // raccord : du point de voie réel le plus proche de A à celui de B
    let a=nearestVertex(info.ways,lk.a[1],lk.a[2]),b=nearestVertex(info.ways,lk.b[1],lk.b[2]);
    if(!a||map.distance(a,[lk.a[1],lk.a[2]])>1500)a=[lk.a[1],lk.a[2]];
    if(!b||map.distance(b,[lk.b[1],lk.b[2]])>1500)b=[lk.b[1],lk.b[2]];
    const mid=[(a[0]+b[0])/2,(a[1]+b[1])/2+(lk.bend||0)];
    info.approx.push({lines:[catmull([a,mid,b],10)],label:lk.label});
    const have=new Set(info.stations.map(x=>x[0]));
    for(const st of [lk.a,lk.b])if(![...have].some(n=>n.replace(/[-' ]/g,'').toLowerCase().includes(st[0].replace(/[-' ]/g,'').toLowerCase().slice(0,14))))info.stations.push(st);
  }
  let bounds=null;const ext=b=>{bounds=bounds?bounds.extend(b):b};
  for(const id of info.ways){const g=wayLL(id);if(g)ext(L.latLngBounds(g))}
  for(const a of info.approx)for(const ln of a.lines)ext(L.latLngBounds(ln));
  if(l.tunnel)ext(L.latLngBounds(l.tunnel));
  s.info=info;s.bounds=bounds;
  s.loaded=info.ways.length>0||info.approx.length>0||!!l.tunnel;s.approx=info.approx.length>0;
  const was=map.hasLayer(s.stations);if(was)map.removeLayer(s.stations);
  s.stations=stationLayer(l,info.stations);
  refreshChip(l);syncStations(l);
}
function prepareAll(){for(const l of L_)prepare(l);scheduleRender()}

let renderQueued=false;
function scheduleRender(){if(renderQueued)return;renderQueued=true;requestAnimationFrame(()=>{renderQueued=false;renderAll()})}
function renderAll(){
  const halo=haloColor();
  const vis=L_.filter(l=>state[l.id].on&&state[l.id].info);
  const share=new Map(); // voie OSM -> lignes visibles qui l'empruntent (ordre du catalogue)
  for(const l of vis)for(const id of state[l.id].info.ways){let a=share.get(id);if(!a)share.set(id,a=[]);a.push(l)}
  for(const l of L_){state[l.id].group.clearLayers();if(state[l.id].on&&state[l.id].info)draw(l,share,halo)}
}
function draw(l,share,halo){
  const s=state[l.id],info=s.info,w=W[l.group];
  const byOff=new Map();
  for(const id of info.ways){
    const g=wayLL(id);if(!g)continue;
    const arr=share.get(id);let off=0;
    if(arr&&arr.length>1){const sp=Math.max(...arr.map(x=>W[x.group]))+1;off=Math.round((arr.indexOf(l)-(arr.length-1)/2)*sp*10)/10}
    let b=byOff.get(off);if(!b)byOff.set(off,b=[]);b.push(g);
  }
  for(const [off,lines] of byOff){
    new OffsetLine(lines,{offset:off,color:halo,weight:w+3,opacity:.85,renderer:haloCanvas,interactive:false}).addTo(s.group);
    new OffsetLine(lines,{offset:off,color:l.color,weight:w,opacity:.95,lineCap:'round',lineJoin:'round',renderer:canvas})
      .bindPopup(popupHtml(l,'Tracé : OpenStreetMap'+(off?' · tronçon partagé, affiché côte à côte':''))).addTo(s.group);
  }
  for(const a of info.approx){
    L.polyline(a.lines,{color:halo,weight:w+3,opacity:.85,renderer:haloCanvas,interactive:false}).addTo(s.group);
    L.polyline(a.lines,{color:l.color,weight:w-1,dashArray:'6 7',lineCap:'round',renderer:canvas}).bindPopup(popupHtml(l,a.label)).addTo(s.group);
  }
  if(l.tunnel){
    const t=catmull(l.tunnel,8);
    L.polyline(t,{color:halo,weight:w+4,opacity:.9,renderer:haloCanvas,interactive:false}).addTo(s.group);
    L.polyline(t,{color:l.color,weight:w+1,dashArray:'1 9',lineCap:'round',renderer:canvas}).bindPopup(popupHtml(l,(l.tunnelLabel||'Nouveau tunnel')+' · ≈ '+lengthKm([l.tunnel]).toFixed(1)+' km')).addTo(s.group);
    for(const [n,a,b] of l.tstations)
      L.circleMarker([a,b],{radius:5.5,color:l.color,weight:3,fillColor:'#fff',fillOpacity:1,renderer:canvas})
        .bindTooltip(n,{direction:'top',offset:[0,-6]}).addTo(s.group);
  }
}
function restyleAll(){scheduleRender()}
function minZoomFor(g){return g==='metro'||g==='tram'?13:11}
function syncStations(l){
  const s=state[l.id];const want=s.on&&map.getZoom()>=minZoomFor(l.group);
  if(want&&!map.hasLayer(s.stations))s.stations.addTo(map);
  if(!want&&map.hasLayer(s.stations))map.removeLayer(s.stations);
}
map.on('zoomend',()=>L_.forEach(syncStations));
function setOn(l,on){
  const s=state[l.id];if(s.on===on)return;s.on=on;
  if(on)s.group.addTo(map);else map.removeLayer(s.group);
  syncStations(l);refreshChip(l);saveSel();scheduleRender();
}
function saveSel(){store('sel2',JSON.stringify(L_.filter(l=>state[l.id].on).map(l=>l.id)))}

const ENDPOINTS=['https://overpass-api.de/api/interpreter','https://overpass.private.coffee/api/interpreter',
  'https://maps.mail.ru/osm/tools/overpass/api/interpreter','https://overpass.kumi.systems/api/interpreter'];
const QUERIES={
  ferre:`[out:json][timeout:300];
(relation["type"="route"]["route"~"^(train|light_rail)$"]["network"~"RER|Transilien",i](48.10,1.40,49.40,3.60);
 relation["type"="route"]["route"~"^(train|light_rail)$"]["name"~"^(RER|Transilien)",i](48.10,1.40,49.40,3.60);
)->.r;.r out geom;node(r.r)[name];out body;`,
  urbain:`[out:json][timeout:240];
(relation["type"="route"]["route"="subway"](48.60,2.00,49.10,2.75);
 relation["type"="route"]["route"~"^(tram|light_rail|train)$"]["ref"~"^T[0-9]+[ab]?$",i](48.50,1.90,49.10,2.80);
)->.r;.r out geom;node(r.r)[name];out body;`
};
const LABELS={ferre:'RER & Transilien',urbain:'Métro, GPE, tram'};
const DATA_V=2;
function idb(){return new Promise((res,rej)=>{try{const r=indexedDB.open('idfmap',1);r.onupgradeneeded=()=>r.result.createObjectStore('c');
  r.onsuccess=()=>res(r.result);r.onerror=()=>rej(r.error)}catch(e){rej(e)}})}
async function cacheGet(k){try{const db=await idb();return await new Promise(r=>{const q=db.transaction('c').objectStore('c').get(k);q.onsuccess=()=>r(q.result);q.onerror=()=>r(null)})}catch(e){return null}}
async function cacheSet(k,v){try{const db=await idb();db.transaction('c','readwrite').objectStore('c').put(v,k)}catch(e){}}

const statusEl=document.getElementById('status'),stxt=document.getElementById('stxt');
function status(t,cls){stxt.textContent=t;statusEl.className=cls||''}

async function overpass(q,label){
  let lastErr;
  for(const ep of ENDPOINTS){
    try{
      status(`${label} : téléchargement OSM (${new URL(ep).host})…`);
      const ctl=new AbortController();const to=setTimeout(()=>ctl.abort(),320000);
      const r=await fetch(ep,{method:'POST',body:'data='+encodeURIComponent(q),signal:ctl.signal,headers:{'Content-Type':'application/x-www-form-urlencoded'}});
      clearTimeout(to);
      if(!r.ok)throw new Error('HTTP '+r.status);
      const j=await r.json();
      if(!j.elements||!j.elements.length)throw new Error('réponse vide');
      return j;
    }catch(e){lastErr=e;console.warn('[carte] '+ep,e)}
  }
  throw lastErr;
}

// Classe une relation OSM -> clé interne (RER:A, TL:L, M:14, T:t3a)
const METRO=new Set(Object.keys(MCOL).concat(['15','16','17','18']));
function keyOf(t){
  const route=t.route||'';let ref=(t.ref||'').trim();const net=((t.network||'')+' '+(t.name||'')+' '+(t.operator||''));
  if(route==='subway'){
    let r=ref.toLowerCase().replace(/\s+/g,'').replace(/^m/,'').replace(/^ligne/,'');
    if(r==='3b')r='3bis';if(r==='7b')r='7bis';
    if(!r){const m=(t.name||'').match(/(?:Ligne|Métro|Metro)\s*(\d+\s*(?:bis)?)/i);if(m)r=m[1].replace(/\s/g,'').toLowerCase()}
    return METRO.has(r)?'M:'+r:null;
  }
  if(/^T\d+[ab]?$/i.test(ref)&&/^(tram|light_rail|train)$/.test(route))return 'T:'+ref.toLowerCase();
  if(/^(train|light_rail)$/.test(route)){
    if(!ref){const m=(t.name||'').match(/^(?:RER|Transilien)\s+(?:ligne\s+)?([A-Z])\b/i);if(m)ref=m[1]}
    ref=ref.toUpperCase();
    if(/RER/i.test(net)&&/^[A-E]$/.test(ref))return 'RER:'+ref;
    if(/Transilien|SNCF|Île-de-France|Ile-de-France/i.test(net)&&/^[HJKLNPRUV]$/.test(ref))return 'TL:'+ref;
  }
  return null;
}
// Format compact stocké : {v,t,parts,rels:[{id,k,n,w:[ids],s:[[nom,lat,lon]]}],ways:{id:[lat,lon,lat,lon…]}}
let DATA=null;const WAYLL=new Map();
const r5=x=>Math.round(x*1e5)/1e5;
function emptyData(){return {v:DATA_V,t:Date.now(),parts:{},rels:[],ways:{}}}
function normalize(json,into){
  const names=new Map(),seenR=new Set(into.rels.map(r=>r.id));
  for(const e of json.elements)if(e.type==='node'&&e.tags&&e.tags.name)names.set(e.id,e.tags.name);
  for(const e of json.elements){
    if(e.type!=='relation'||!e.tags||seenR.has(e.id))continue;
    const k=keyOf(e.tags);if(!k)continue;
    const t=e.tags,r={id:e.id,k,n:[t.name,t.from,t.to,t.via,t.description].filter(Boolean).join(' | '),w:[],s:[]};
    const ss=new Set();
    for(const m of e.members||[]){
      if(m.type==='way'&&m.geometry&&!/platform/.test(m.role||'')){
        if(!into.ways[m.ref]){const f=[];for(const p of m.geometry)if(p){f.push(r5(p.lat),r5(p.lon))}into.ways[m.ref]=f}
        r.w.push(m.ref);
      }else if(m.type==='node'&&/^stop/.test(m.role||'')&&m.lat!=null){
        const n=names.get(m.ref);if(n&&!ss.has(n)){ss.add(n);r.s.push([n,r5(m.lat),r5(m.lon)])}
      }
    }
    into.rels.push(r);seenR.add(e.id);
  }
}
// Géométrie d'une voie, orientée de façon canonique (même sens pour toutes les lignes qui la partagent)
function wayLL(id){
  let g=WAYLL.get(id);if(g)return g;
  const f=DATA&&DATA.ways[id];if(!f||f.length<4)return null;
  g=[];for(let i=0;i<f.length;i+=2)g.push([f[i],f[i+1]]);
  const a=g[0],b=g[g.length-1],dx=(b[1]-a[1])*.66,dy=b[0]-a[0];
  if((Math.abs(dx)>=Math.abs(dy)?dx:dy)<0)g.reverse();
  WAYLL.set(id,g);return g;
}
// Sélection des relations d'une source : {k, only:/re/, not:/re/, west:lon}. Le texte testé = nom/from/to/via + gares desservies.
function centroid(g){let a=0,b=0;for(const p of g){a+=p[0];b+=p[1]}return [a/g.length,b/g.length]}
// boîte = [latMin, latMax, lonMin, lonMax]
function inBoxes(p,boxes){return boxes.some(([a,b,c,d])=>p[0]>=a&&p[0]<=b&&p[1]>=c&&p[1]<=d)}
function relText(r){return r.n+' | '+r.s.map(x=>x[0]).join(' | ')}
// Vrai si la relation correspond au critère : regex sur nom/gares, ou une voie qui passe à moins de m mètres d'un point
const NEARC=new Map();
function relNear(r,lat,lon,m){
  const key=r.id+':'+lat+':'+lon+':'+m;if(NEARC.has(key))return NEARC.get(key);
  const dLat=m/111320,dLon=m/(111320*Math.cos(lat*Math.PI/180));let hit=false;
  for(const id of r.w){const f=DATA.ways[id];if(!f)continue;
    for(let i=0;i<f.length;i+=2){const a=(f[i]-lat)/dLat,b=(f[i+1]-lon)/dLon;if(a*a+b*b<=1){hit=true;break}}if(hit)break}
  NEARC.set(key,hit);return hit;
}
function matches(r,c){
  if(c instanceof RegExp)return c.test(relText(r));
  if(c.re&&c.re.test(relText(r)))return true;
  return !!(c.near&&c.near.some(([a,b,m])=>relNear(r,a,b,m)));
}
function collect(l){
  const ways=new Set(),st=new Map();
  for(const item of l.src){
    const it=typeof item==='string'?{k:item}:item;
    let rs=DATA.rels.filter(r=>r.k===it.k);
    if(it.only){rs=rs.filter(r=>matches(r,it.only));if(!rs.length&&DATA.parts.ferre)console.warn('[carte] aucune relation',it.k,'ne correspond à',it.only)}
    if(it.not){const f=rs.filter(r=>!matches(r,it.not));if(!f.length&&rs.length)console.warn('[carte] toutes les relations',it.k,'correspondent à',it.not,'— branche impossible à isoler');rs=f}
    for(const r of rs){
      for(const id of r.w){if(ways.has(id))continue;const g=wayLL(id);if(!g)continue;
        if(it.west!=null&&!g.every(p=>p[1]<it.west))continue;if(it.east!=null&&!g.every(p=>p[1]>=it.east))continue;
        if(it.drop&&inBoxes(centroid(g),it.drop))continue;ways.add(id)}
      for(const x of r.s){if(it.west!=null&&!(x[2]<it.west))continue;if(it.east!=null&&!(x[2]>=it.east))continue;if(it.drop&&inBoxes([x[1],x[2]],it.drop))continue;if(!st.has(x[0]))st.set(x[0],x)}
    }
  }
  return {ways:[...ways],stations:[...st.values()]};
}
function useData(d,src){DATA=d;WAYLL.clear();NEARC.clear();DATA_SRC=src;prepareAll()}
let DATA_SRC='';
function fmtDate(t){try{return new Date(t).toLocaleDateString('fr-FR')}catch(e){return ''}}
function summary(){
  const missing=L_.filter(l=>!state[l.id].loaded).map(l=>l.name);
  const src={file:'fichier donnees_idf.js',cache:'cache du navigateur',net:'OpenStreetMap (à enregistrer)',import:'fichier importé'}[DATA_SRC]||'';
  status(`Données : ${src} · ${fmtDate(DATA.t)}`+(missing.length?` · ${missing.length} ligne(s) sans données`:''),'ok');
}
async function loadData(force){
  if(force)useData(emptyData(),'net');
  else if(window.IDF_DATA&&window.IDF_DATA.v===DATA_V)useData(window.IDF_DATA,'file');
  else{const c=await cacheGet('data-v2');useData(c&&c.v===DATA_V?c:emptyData(),c&&c.v===DATA_V?'cache':'net')}
  let fetched=false,errors=0;
  for(const k of ['ferre','urbain']){
    if(DATA.parts[k])continue;
    try{const j=await overpass(QUERIES[k],LABELS[k]);normalize(j,DATA);DATA.parts[k]=Date.now();fetched=true;WAYLL.clear();NEARC.clear();prepareAll()}
    catch(e){errors++;console.error(e);status(`${LABELS[k]} : échec (${e.message}). Réessaie avec ↻.`,'err')}
  }
  if(fetched){DATA.t=Date.now();if(DATA_SRC!=='file')DATA_SRC='net';cacheSet('data-v2',DATA);document.getElementById('save').classList.add('pulse')}
  if(!errors)summary();
  console.info('[carte] relations :',DATA.rels.length,'· voies :',Object.keys(DATA.ways).length);
}
// Enregistrer / importer le fichier de données
document.getElementById('save').onclick=()=>{
  if(!DATA||!DATA.rels.length){status('Rien à enregistrer pour l’instant.','err');return}
  const blob=new Blob(['window.IDF_DATA=',JSON.stringify(DATA),';\n'],{type:'text/javascript'});
  const a=document.createElement('a');a.href=URL.createObjectURL(blob);a.download='donnees_idf.js';
  document.body.appendChild(a);a.click();setTimeout(()=>{URL.revokeObjectURL(a.href);a.remove()},3000);
  document.getElementById('save').classList.remove('pulse');
  status('donnees_idf.js enregistré : place-le dans le même dossier que la carte.','ok');
};
document.getElementById('open').onclick=()=>document.getElementById('file').click();
document.getElementById('file').onchange=async e=>{
  const f=e.target.files[0];if(!f)return;
  try{let t=await f.text();t=t.trim().replace(/^window\.IDF_DATA\s*=\s*/,'').replace(/;\s*$/,'');
    const d=JSON.parse(t);if(d.v!==DATA_V)throw new Error('version '+d.v);
    useData(d,'import');cacheSet('data-v2',d);summary();
  }catch(err){status('Fichier illisible : '+err.message,'err')}
  e.target.value='';
};
document.getElementById('reload').onclick=()=>loadData(true);

/* ------------------------------------------------------------------ */
/*  7. Démarrage                                                       */
/* ------------------------------------------------------------------ */
const savedBase=load('base');if(savedBase&&[...sel.options].some(o=>o.value===savedBase))sel.value=savedBase;
setTheme(load('theme')==='light'?'light':'dark');
let saved=null;try{saved=JSON.parse(load('sel2')||'null')}catch(e){}
const initial=new Set(Array.isArray(saved)?saved:[...DEFAULT_ON]);
prepareAll();
for(const l of L_)if(initial.has(l.id))setOn(l,true);
if(innerWidth<=720)panel.classList.add('collapsed');
loadData(false);
})();
</script>
